<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Acesso indisponível — Alumni</title>
    <style>
        :root {
            --bg: #f5f5f0;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-dim: #4a4a5a;
            --border: #d4d4cc;
            --accent: #003080;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
        }
        main {
            max-width: 480px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 10px;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
        p { margin: 0; font-size: 1rem; line-height: 1.6; color: var(--text-dim); }
    </style>
</head>
<body>
    <main>
        <h1>Acesso indisponível</h1>
        <p>Este material não está disponível no momento. Para mais informações, entre em contato com a equipe Alumni.</p>
    </main>
</body>
</html>
