name: Valida aulas (gates do modelo)

# Trava física do PR: NENHUMA aula nova entra no main sem passar pelos gates,
# mesmo que alguém esqueça de rodar local. Arquivo NOVO = gate completo
# (estrutura + vozes por personagem + contraste computado). Arquivo MODIFICADO =
# anti-regressão (aula/stamp/slide não pode sumir, arquivo não pode encolher).

on:
  pull_request:
    paths:
      - 'public/professor/**.html'
      - 'public/aluno/**.html'
      # As paginas do sistema (dashboard, index, perfil, governanca) nao acionavam gate
      # NENHUM — nem o canario, nem o GATE 8, nem o check de handler morto. O PR #1859
      # mexeu no dashboard e foi mergeado na mao porque o check `gates` nem existia, e o
      # merge_aula.py (com razao) se recusa a mergear sem ele. A dashboard e a tela por
      # onde a chefe entrega material ao aluno: um botao morto ali custa mais que num
      # slide. O classificador de arquivos abaixo so olha professor/aluno, entao para
      # estes PRs os gates por-arquivo saem vazios e o que roda e o que faz sentido:
      # canario, YAML valido e GATE 8 (repo inteiro).
      - 'public/*.html'
      # O vercel.json decide o ROTEAMENTO de producao (redirects, headers, functions).
      # Um erro aqui nao quebra uma aula — quebra o site inteiro, e ele nao acionava
      # gate nenhum. O job so classifica arquivos de professor/aluno, entao aqui rodam
      # o canario, o YAML valido e o GATE 8.
      - 'vercel.json'
      # O estrago que mais dói NÃO chega por um arquivo de aula: chega pelo BUILDER e
      # pelo MODELO, que reescrevem centenas de aulas de uma vez. Sem estes paths, um PR
      # que mexe só no _build/ ou no scripts/ não acionava gate NENHUM — foi assim que o
      # snake() não-injetivo (2 frases -> 1 mp3) viveu meses. O GATE 8 varre o repo
      # inteiro, então é aqui que ele ganha os dentes.
      - '_build/**'
      - 'scripts/**'
      - '.github/workflows/validate-lessons.yml'
      # O CLAUDE.md reescreve aula em MASSA tanto quanto o builder — so que por outro
      # caminho: ele e a regra que o gerador OBEDECE. A REGRA 2.1 mandava esconder a
      # pergunta do listening e produziu 224 arquivos com a tarefa escondida; a instrucao
      # "a professora" produziu 59. Nos dois casos o defeito nasceu de um PR que nao
      # acionava gate NENHUM, porque so mexia em documentacao. Regra e codigo.
      - 'CLAUDE.md'

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 CONTINUA obrigatorio — sem historico completo o
          # `git merge-base` falha e a classificacao de arquivos do PR morre
          # ("fatal: origin/main...HEAD: no merge base"; ver comentario abaixo).
          fetch-depth: 0
          # ── public/audio NAO vem pro runner ────────────────────────────────
          # Sao 4,94 GiB de MP3 no HEAD, ~86% do repo. Todo run baixava isso
          # ANTES do primeiro gate. Em 29/07/2026 o `actions/checkout` pendurou
          # QUATRO vezes, de 30 a 50 min, travando a entrega de 3 alunos; o
          # `gh run cancel` nem pegava (runner pendurado nao aceita cancelamento)
          # e so fechar+reabrir o PR redisparava.
          #
          # Tirar o audio da ARVORE e seguro porque os gates que dependem dele ja
          # perguntam ao GIT, nao ao disco — e isso ja estava escrito no codigo:
          #   validate_lesson.audio_existe()      -> disco OU `git ls-files`
          #   check_lesson_integrity.py           -> idem ("NAO materializados
          #                                          na arvore local (sao gigabytes)")
          #   check_order_audio_len.py            -> `git cat-file -s` do blob
          # O `blob:none` completa: os blobs de audio nao sao nem baixados, e o
          # que algum gate precisar abrir e buscado sob demanda (dezenas de
          # arquivos, nao 78 mil).
          #
          # PROVA de que isto nao afrouxa nada: o CANARIO roda o fixture
          # `audio-faltando.html` — audioMap apontando pra MP3 inexistente — e
          # exige que o gate REPROVE. Se alguem quebrar o fallback do git, toda
          # aula passaria a "ter audio" em silencio (no disco do runner nao ha
          # mp3 nenhum mesmo) e o canario fica VERMELHO na hora.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/audio

      # ╔══════════════════════════════════════════════════════════════════════╗
      # ║ CANARIO — o vigia que nao confia no verde do gate.                    ║
      # ╚══════════════════════════════════════════════════════════════════════╝
      # Roda ANTES de tudo e SEM condicao: mesmo que a classificacao de arquivos
      # quebre de novo (foi o bug de 14/07 que dormiu os GATES 1-7), o canario
      # ainda roda. Ele pega fixtures propositalmente quebrados e exige que os
      # gates os REPROVEM. Se um gate passar um fixture — porque morreu, foi
      # pulado, ou teve a logica quebrada — o canario fica VERMELHO aqui, na hora,
      # em vez de meses depois quando alguem abrir a aula. Um gate verde nao prova
      # que o gate funciona; o canario prova, a cada PR, que ele ainda MORDE.
      - name: "CANARIO — prova que os gates ainda reprovam defeito conhecido"
        run: python3 scripts/canary/run.py

      # Irmao do canario, e pelo mesmo motivo: o canario prova que o gate ainda
      # MORDE; este prova que o gate ainda EXISTE. Workflow com YAML invalido nao
      # falha — ele NAO RODA (startup failure: zero jobs, zero log, zero alerta).
      # O guard-main.yml passou UM MES assim, 100 runs sem um unico job, e levou
      # junto a tag `last-good`, que ele deveria avancar a cada push limpo e ficou
      # congelada 1.683 commits atras — enquanto o arquivo mandava usa-la pra
      # "restaurar tudo a qualquer momento".
      - name: "GATE 0 — todo workflow do CI parseia e roda de verdade"
        run: |
          pip install pyyaml --quiet
          python3 scripts/check_workflows.py

      # ╔══════════════════════════════════════════════════════════════════════╗
      # ║ GATE M — o MOLDE passa em TODO gate, em TODO PR. Sem excecao.        ║
      # ╚══════════════════════════════════════════════════════════════════════╝
      # Sem condicao, igual ao canario, e pelo mesmo motivo. TODOS os outros
      # gates (1-7, 9) so rodam nos arquivos DO PR (steps.files.outputs.*), entao
      # o modelo so era checado se o PR por acaso o tocasse. E o GATE 8, que varre
      # o repo inteiro, filtra pelo legacy-baseline — que dava ALVARA ao modelo
      # para seguir quebrado, igual a qualquer aula velha.
      #
      # Isso ja custou caro duas vezes:
      #   - #1316 criou o gate do header ("Lesson N", nao "Aula N") e consertou 4
      #     alunos — deixando o MODELO com "Aula 1" por semanas.
      #   - o modelo carregou 7.812 bytes de JS morto dentro de
      #     <script src="/lib/contrast-guard.js"> (as funcoes de gravacao, REGRA 8
      #     e 26; tag com src descarta o corpo inline). O builder CLONA o shell do
      #     modelo, entao virou ~2.000 arquivos e 10 botoes mortos na Eduarda.
      #
      # Consertar o aluno e enxugar gelo: o molde reimprime o defeito na proxima
      # aula. Por isso o molde tem tolerancia ZERO — sem baseline, sem alvara, sem
      # depender de alguem lembrar de rodar o gate nele.
      #
      # O ganho e composto: todo gate FUTURO plugado no validate_lesson passa a
      # valer para o molde de graca, sem ninguem lembrar de nada. Regra que depende
      # de memoria humana nao e regra — e sorte.
      - name: "GATE M — o modelo (molde de toda aula) passa em todos os gates"
        run: |
          python3 _build/model/validate_lesson.py \
            public/professor/helen-mendes-aula1.html \
            public/professor/helen-mendes.html \
            public/aluno/helen-mendes.html

      - name: Classifica arquivos de aula do PR
        id: files
        # ╔══════════════════════════════════════════════════════════════════════╗
        # ║ ESTE PASSO JA FALHOU EM SILENCIO — e levou os GATES 1-7 junto.       ║
        # ╚══════════════════════════════════════════════════════════════════════╝
        # O `git fetch --depth=1` deixava origin/main SEM HISTORICO. O `A...B` do git
        # precisa de merge base, nao achava, e morria:
        #
        #     fatal: origin/main...HEAD: no merge base
        #
        # So que o erro era ENGOLIDO pelo `| tr`: o exit code de um pipeline e o do
        # ULTIMO comando, e o tr sempre sai 0. Resultado: passo VERDE, listas VAZIAS,
        # e os sete gates seguintes saindo `skipped`. Meses de PRs de aula entraram no
        # main sem UM gate rodar — com o check verde do lado. Gate que falha em silencio
        # e pior que gate nenhum: da a sensacao de protecao sem proteger.
        #
        # Tres travas agora:
        #   1. fetch COMPLETO do base ref (sem --depth), pra existir merge base;
        #   2. `set -euo pipefail`, pra que erro em pipeline NAO seja mais engolido;
        #   3. checagem explicita: se o PR toca HTML de aula e a classificacao sai
        #      vazia, o passo FALHA em vez de passar verde sem checar nada.
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          BASE="origin/$BASE_REF"

          git fetch --no-tags --prune origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

          if ! git merge-base "$BASE" HEAD >/dev/null 2>&1; then
            echo "::error::Sem merge base entre $BASE e HEAD — impossivel classificar os arquivos do PR."
            echo "::error::Os gates NAO podem rodar. Falhando de proposito, em vez de passar verde sem checar."
            exit 1
          fi

          ADDED=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- 'public/professor/*.html' 'public/aluno/*.html' | tr '\n' ' ')
          MODIFIED=$(git diff --name-only --diff-filter=M "$BASE"...HEAD -- 'public/professor/*.html' 'public/aluno/*.html' | tr '\n' ' ')
          TOCADOS=$(git diff --name-only "$BASE"...HEAD -- 'public/professor/*.html' 'public/aluno/*.html' | wc -l)
          # DELETADO e a terceira categoria, e ela existe. Um PR que so APAGA pagina nao tem
          # nada em A nem em M — e o anti-skip abaixo lia isso como "classificacao vazia = bug"
          # e reprovava. Deletado E classificado; o que ele nao tem e gate por-arquivo pra
          # rodar (o arquivo nao existe mais). Quem defende a delecao e o merge_aula.py, que
          # so libera se o vercel.json ja servir aquela URL por redirect.
          DELETADO=$(git diff --name-only --diff-filter=D "$BASE"...HEAD -- 'public/professor/*.html' 'public/aluno/*.html' | tr '\n' ' ')

          # Anti-skip-silencioso: HTML de aula no diff, mas classificacao vazia = bug aqui.
          if [ "$TOCADOS" -gt 0 ] && [ -z "${ADDED// }${MODIFIED// }${DELETADO// }" ]; then
            echo "::error::$TOCADOS arquivo(s) de aula no diff, mas a classificacao saiu VAZIA."
            echo "::error::Isso significa que os GATES 1-7 seriam pulados. Falhando de proposito."
            exit 1
          fi

          echo "added=$ADDED" >> "$GITHUB_OUTPUT"
          echo "modified=$MODIFIED" >> "$GITHUB_OUTPUT"
          echo "Arquivos de aula tocados: $TOCADOS"
          echo "Novos: $ADDED"
          echo "Modificados: $MODIFIED"
          echo "Deletados: $DELETADO"

      - name: "GATE 1 — estrutura + vozes por personagem (arquivos novos)"
        if: steps.files.outputs.added != ''
        run: python3 _build/model/validate_lesson.py ${{ steps.files.outputs.added }}

      - name: "GATE 2 — contraste computado headless (arquivos novos)"
        if: steps.files.outputs.added != ''
        run: python3 _build/model/check_contrast.py ${{ steps.files.outputs.added }}

      - name: "GATE 3 — anti-regressão (arquivos modificados)"
        if: steps.files.outputs.modified != ''
        run: python3 _build/model/check_no_regression.py --base "origin/${{ github.base_ref }}" ${{ steps.files.outputs.modified }}

      - name: "GATE 4 — vazamento de aba + shell divergente (hubs tocados, novos E modificados)"
        # Trava o caso TÂNIA: accordion/Complementares vazando entre abas (ORPHAN/ESCAPE/
        # SLIDES_COMP/DIV_IMBAL/MENU_MIX) e shell pré-modelo (OLD_SHELL). Só checa HUBs
        # (ignora standalones e slugs lixo). Bloqueia o PR se algum hub tocado tiver defeito.
        if: steps.files.outputs.added != '' || steps.files.outputs.modified != ''
        run: python3 _build/model/audit_hubs_struct.py --check ${{ steps.files.outputs.added }} ${{ steps.files.outputs.modified }}

      - name: "GATE 5 — integridade de áudio (arquivos do PR: novos E modificados)"
        # Pega aula publicada apontando p/ .mp3 que NÃO existe (aula "sem som") e HTML
        # truncado/corrompido. ESCOPADO nos arquivos DO PR: a geração em curso de OUTRO
        # aluno nunca trava este gate — era exatamente o repo-inteiro no buildCommand do
        # Vercel que congelava a produção por uma única aula a meio de geração.
        if: steps.files.outputs.added != '' || steps.files.outputs.modified != ''
        run: python3 scripts/check_lesson_integrity.py ${{ steps.files.outputs.added }} ${{ steps.files.outputs.modified }}

      - name: "GATE 5b — áudio de ordenação [order-lN] truncado (arquivos do PR)"
        # O GATE 5 pega áudio FALTANDO; este pega áudio VÁLIDO porém TRUNCADO. O
        # exercício "Put in Order" toca uma frase única concatenada; se a API do
        # ElevenLabs devolveu ~1s (e o gerador PULA arquivos existentes, nunca
        # regenerando), o aluno ouve 1 segundo de nada e o defeito é invisível
        # (MP3 válido, HTML válido). Aconteceu em 9 arquivos da Anna + 25 em 8 alunos.
        # TEXT-AWARE: compara o tamanho do MP3 com o ESPERADO pelo texto do exercício
        # (nº de chars), então NÃO flagra word-scramble (1 frase curta, ~2s é o certo) —
        # um piso fixo de bytes dava falso-positivo. Auto-reparo: repair_order_audio.py.
        if: steps.files.outputs.added != '' || steps.files.outputs.modified != ''
        run: python3 scripts/check_order_audio_len.py ${{ steps.files.outputs.added }} ${{ steps.files.outputs.modified }}

      - name: "GATE 6 — reintrodução de padrão já consertado (novos E modificados)"
        # BLOQUEANTE também em arquivo MODIFICADO, ao contrário do validador abaixo.
        # É esse o buraco que ele tapa: uma branch ramificada ANTES de um conserto
        # sobrescreve o arquivo e reintroduz o bug ao mergear, e o anti-regressão não
        # vê (só conta ex-lesson, stamp e slide). Aconteceu em 10/07 com o alert do
        # Chrome e com os links de busca. Critério = "não piorou vs a base", não
        # "zero" — 49 páginas legadas ainda têm link de busca e travar todo PR que as
        # toque seria pior que o bug.
        if: steps.files.outputs.added != '' || steps.files.outputs.modified != ''
        run: python3 scripts/check_forbidden_patterns.py --base "origin/${{ github.base_ref }}" ${{ steps.files.outputs.added }} ${{ steps.files.outputs.modified }}

      - name: "GATE 7 — botão morto: JS inline que não compila (novos E modificados)"
        # Pega o BOTÃO QUE NÃO FUNCIONA. O gerador concatena o inglês do aluno dentro
        # de uma string JS dentro de um atributo HTML; o apóstrofo vira &#39;, o browser
        # DESESCAPA antes de compilar, a string fecha errado e o handler morre:
        #   onclick="speakText('Rachel&#39;s task is done.',this)"  -> SyntaxError no clique
        # Invisível para todo mundo: HTML válido, página abre, console limpo — o Chrome
        # só compila handler inline NA HORA DO CLIQUE. Nenhum validador olhava os
        # ATRIBUTOS (o audiomap checker só parseia dentro do <script>). Era o ponto cego,
        # e é exatamente onde o texto do aluno entra: 324 botões mortos em 48 arquivos
        # (169 de áudio = a aula não toca som; 155 de gabarito = a resposta não abre).
        # Usa new Function() = V8 = o motor do Chrome. Não simula o browser: usa o browser.
        # Critério "não piorou vs a base" (igual GATE 6) enquanto o legado não é consertado.
        if: steps.files.outputs.added != '' || steps.files.outputs.modified != ''
        run: node scripts/check_inline_js.mjs --base "origin/${{ github.base_ref }}" ${{ steps.files.outputs.added }} ${{ steps.files.outputs.modified }}

      - name: "GATE 7b — handler chama função INDEFINIDA (botão morto silencioso)"
        # O irmão do GATE 7: aquele COMPILA o handler (pega sintaxe); este casa a função
        # CHAMADA (`onclick="X(...)"`) com uma DEFINIÇÃO no <script> inline. `X` chamado e
        # não definido = botão que quebra no CLIQUE (ReferenceError) — o GATE 7 não vê,
        # compila liso. Foi assim que o "Check Answers" morto (verifyAllMatches ausente do
        # shell) ficou escondido em 1400+ hubs. Corrigido no MODELO helen-mendes (FORMA);
        # este gate impede reintrodução. Critério "não piorou vs base" (igual 6/7) — o
        # legado não dispara nem exige retrofit; arquivo NOVO = tolerância zero.
        if: steps.files.outputs.added != '' || steps.files.outputs.modified != ''
        run: python3 scripts/check_undefined_handlers.py --base "origin/${{ github.base_ref }}" ${{ steps.files.outputs.added }} ${{ steps.files.outputs.modified }}

      - name: "GATE 8 — o legado não piora (varre o REPO INTEIRO, não só o diff)"
        # TODOS os outros gates olham apenas os arquivos que o PR mudou. Um arquivo que
        # quebrou e que ninguém mais tocou nunca mais é olhado — o defeito fica escondido
        # até alguém encostar naquele aluno, e aí "aparece", como se tivesse nascido ali.
        #
        # E o jeito que as coisas quebram aqui NÃO é pelo diff: é por efeito colateral.
        # Mexer no builder / no modelo / rodar um retrofit escreve em centenas de arquivos
        # que o PR nem lista. Casos reais: o checkout defasado que apagou as aulas 6-10 de
        # 4 hubs; um regex guloso que ia reescrever 2.182 arquivos em vez de 48.
        #
        # Este gate NÃO exige legado limpo (são 3.243 defeitos herdados, 1.428 arquivos —
        # isso é campanha, não gate; e aula já dada NÃO se mexe). Ele exige uma coisa só:
        #   NENHUM ARQUIVO GANHA UM DEFEITO QUE NÃO TINHA.
        # O legado é o alvará congelado em scripts/legacy-baseline.json. Só pode CAIR.
        # ~45s para 2.217 arquivos. Não escreve em nada: é alarme, não é reforma.
        run: python3 scripts/check_legacy_baseline.py

      # ╔══════════════════════════════════════════════════════════════════════╗
      # ║ GATE 10 — VOCAB REVEAL NASCIDO ESCONDIDO (varre o REPO INTEIRO).     ║
      # ╚══════════════════════════════════════════════════════════════════════╝
      # O card de "Vocabulary Reveal" esconde a PALAVRA num .vocab-back e a mostra
      # no clique. Há dois mecanismos: (A) reveal 100% CSS — revealVocab só faz
      # classList.add('revealed') e o CSS (.revealed .vocab-back{opacity:1}) mostra;
      # (B) reveal por JS — revealVocab faz back.style.display=''. Num reveal (A), um
      # display:none/visibility:hidden/opacity:0 INLINE no back sobrevive ao
      # .revealed (inline vence stylesheet) e a palavra NUNCA aparece — o professor
      # clica e nada acontece (luiz-bressane aulas 7/8; eduarda-gabriel x2). O gate
      # distingue A de B, então NÃO flagra os arquivos do mecanismo B (que têm
      # display:none de propósito e funcionam). Repo inteiro, como o GATE 8, porque
      # o defeito nasce escondido e some do diff. O --selftest roda antes e prova, a
      # cada PR, que o gate ainda REPROVA o padrão quebrado (filosofia do CANARIO).
      - name: "GATE 10 — selftest: prova que o gate de vocab reveal ainda morde"
        run: python3 scripts/check_vocab_reveal.py --selftest

      - name: "GATE 10 — conteúdo de reveal nasce escondido (repo inteiro)"
        # Cobre as 3 famílias de reveal: .vocab-back (a PALAVRA), .q-answer (a RESPOSTA
        # da compreensão) e .error-fix (a CORREÇÃO do Spot the Error). A checagem é POR
        # INSTÂNCIA: cada alvo escondido é amarrado ao onclick do SEU próprio card, porque
        # um mesmo arquivo tem vários handlers (revealError, revealError1, revealError7...).
        # Checar por arquivo dava falso positivo — foi o que inocentou elaine-mieko-pinho,
        # tuca-dias e luiz-bressane-backup-a2, que a checagem grosseira acusava por engano.
        run: python3 scripts/check_vocab_reveal.py

      - name: "GATE 12 — selftest: prova que o gate do PPP ainda morde"
        run: python3 scripts/check_ppp_lesson.py --selftest

      - name: "GATE 12 — aula do framework PPP (7-15 slides, capítulos, answer key, gramática implícita)"
        # O primeiro gate ESCOPADO A UM FRAMEWORK ("escopar, não generalizar" — decisão do
        # Dan, 27/07/2026). O validate_lesson foi escopado ao Imersivo; este cobra as regras
        # do PPP. Só olha arquivo com <meta name="alumni-framework" content="ppp"> — qualquer
        # outra aula é ignorada, então nasce sem tocar em nada do que já existe.
        run: python3 scripts/check_ppp_lesson.py

      - name: "GATE 13 — selftest: prova que o gate do Communicative ainda morde"
        run: python3 scripts/check_communicative_lesson.py --selftest

      - name: "GATE 13 — aula do framework Communicative (6 stages, tarefa é o núcleo, warm-up aberto)"
        # Irmão do GATE 12, para o outro framework. A regra mais valiosa aqui é a do
        # Warm-up SEM exercício controlado: é a que se viola sem perceber (basta achar que
        # "um matchingzinho ajuda") e é exatamente o que transformaria a aula em PPP.
        run: python3 scripts/check_communicative_lesson.py

      - name: "GATE 14 — selftest: prova que o gate do Task-Based ainda morde"
        run: python3 scripts/check_tbl_lesson.py --selftest

      - name: "GATE 15 — selftest: prova que o gate dos modos de produção ainda morde"
        run: python3 scripts/check_produce_modes.py --selftest

      - name: "GATE 15 — modos de produção do IN CLASS (pelo menos 2 por aula, role-play fora)"
        # A tabela que o pedagógico fechou em 28/07/2026 define QUAIS atividades podem
        # ocupar a etapa de produção e quantas por aula (pelo menos 2). Role-play saiu do
        # menu: em aula PARTICULAR ele põe o professor como interlocutor, e a fala do
        # aluno passa a depender da atuação dele.
        # Por que virou gate e não só regra escrita: role-play é o formato mais fácil de
        # escrever e o mais tentador — era exatamente o que a produção da Lara era antes.
        # Regra que depende de alguém lembrar não é regra.
        run: python3 scripts/check_produce_modes.py

      - name: "GATE 14 — aula do framework Task-Based (Focus on Form DEPOIS da produção)"
        # O mais opinativo dos três gates de framework, porque o TBL é o que mais se
        # parece com os outros por fora e o que mais diverge por dentro. A regra central:
        # Focus on Form existe E vem depois do Task Cycle. Se sumir ou trocar de lugar,
        # não é TBL — é PPP com outros rótulos. Também barra stage "Practice", que o
        # documento proíbe explicitamente antes da tarefa.
        run: python3 scripts/check_tbl_lesson.py

      - name: "GATE 11 — selftest: prova que o gate de framework ainda morde"
        # Inclui os casos do RODÍZIO (30/07/2026): a aula N tem de trazer o framework que a
        # sequência declarada pede. Sem selftest, "declarei rodízio" viraria uma forma de
        # DESLIGAR a checagem de mistura sem ninguém notar.
        run: python3 scripts/check_framework_isolation.py --selftest

      - name: "GATE 11 — isolamento de framework (aluno real nunca recebe método em validação)"
        # Ordem do Dan (27/07/2026): "não quero que NADA DE ALUNOS JÁ ATUAIS utilize os
        # frameworks que vamos inserir agora [...] gerar alunos mock, validar, pra só
        # depois implementar". Este gate é o que torna isso IMPOSSÍVEL em vez de combinado.
        # Fonte da verdade: public/data/frameworks.json (categorias × frameworks + mocks).
        # LEGADO-TOLERANTE por construção: aula SEM a etiqueta <meta name="alumni-framework">
        # é ignorada — as ~1.240 aulas anteriores a este eixo não têm a etiqueta e NÃO serão
        # tocadas pra ganhar uma (REGRA 30). Por isso o gate nasce em 0 e não exige retrofit.
        # Repo inteiro (como o 8 e o 10): a violação pode estar num arquivo que este PR não
        # tocou — ex.: alguém promover um framework a "produção" no JSON sem perceber que
        # isso libera aula experimental que já estava no ar.
        run: python3 scripts/check_framework_isolation.py

      - name: "BANCO — os exercícios oferecidos existem mesmo no builder"
        # O banco (public/data/exercicios.json) é o que o editor do catálogo oferece pra
        # montar framework. Ele NÃO é uma lista digitada: o gerador chama render_block()
        # do builder pra cada exercício e guarda as classes que sairam. Este passo refaz
        # essa prova. Falha aqui = o builder perdeu (ou ganhou) um exercício e o banco
        # ficou mentindo — e um banco que promete o que o builder não monta quebra a aula
        # na geração, não aqui.
        run: python3 scripts/gen_banco_exercicios.py --check

      - name: "GATE 26 — selftest: prova que o gate de coerência interna ainda morde"
        run: python3 scripts/check_coerencia_interna.py --selftest

      - name: "GATE 26 — a nota manda fazer o que a tela permite fazer"
        # Item 2.10 da instrução corretiva: a Teacher's Note mandava "toque o áudio" numa aula
        # de LEITURA. Era a camada "Coerência interna" do 03 §8, e saía NÃO VERIFICADO em todo
        # relatório por não ter gate. A primeira versão das regras disparou 20x no próprio
        # artefato — o que prova defeito na REGRA, não no artefato: polissemia ("leia o quadro"
        # é o brief, que estava na tela) e prosa que descreve o percurso em vez de mandar. A
        # versão que ficou é muda nas 63 telas dele, e mesmo assim pegou um defeito real.
        run: python3 scripts/check_coerencia_interna.py

      - name: "GATE 25 — selftest: prova que o gate factual ainda morde"
        run: python3 scripts/check_factual.py --selftest

      - name: "GATE 25 — a fonte está na tela, e o gabarito não cita o que ela não tem"
        # Camada "Factual" do 03 §6/§8, na parte que dá para provar sem ler a fonte: todo texto
        # na tela declara de onde veio (12 de 12 no artefato), o gabarito não cita rótulo de
        # fonte que a tela não mostra, e material declarado SIMULADO no syllabus não carrega
        # link externo de veículo real — ficção vestida de documento é o pior defeito desta
        # camada e o único visível sem leitura humana.
        run: python3 scripts/check_factual.py

      - name: "GATE 24 — selftest: prova que o gate de syllabus ainda morde"
        run: python3 scripts/check_syllabus_ciclo.py --selftest

      - name: "GATE 24 — o syllabus do ciclo tem os dez campos, e bate com o que a aula gastou"
        # Duas falhas medidas em 11/08/2026: a aba "Syllabus 20 aulas" do hub tinha 135
        # bytes (a frase de esqueleto do shell, zero aula), e estado.json -> mecanicas_gastas
        # estava VAZIO depois de quatro aulas geradas — nada escrevia nele. O docx §5 pede o
        # estado acumulativo e diz por quê: "o gerador não deve depender de memória narrativa
        # presumida". Sem ele, "não repetir a mesma combinação no bloco" (03 §4.2) era só
        # intenção. O gate cobra os 10 campos do §3.1 por aula, a ficha da fase 1 do prompt
        # controlador, e o cruzamento declarado x medido.
        run: python3 scripts/check_syllabus_ciclo.py

      - name: "GATE 23 — selftest: prova que o gate de notas ainda morde"
        run: python3 scripts/check_teacher_notes.py --selftest

      - name: "GATE 23 — a nota do professor existe, tem tempo e não grita"
        # Item 2.15 da instrução corretiva nomeia três expressões — "NÃO ajude", "force a
        # resposta", "TEM de responder". As três ainda estavam no material meses depois,
        # porque a correção era prosa num .docx e nada no repo a cobrava. As três exigências
        # são medidas no artefato, não opinadas: 63 telas, 63 notas, 63 com orçamento de
        # tempo. Caixa alta MARCANDO palavra continua liberada — o que barra é o comando.
        run: python3 scripts/check_teacher_notes.py

      - name: "GATE 22 — selftest: prova que o gate de espinha ainda morde"
        run: python3 scripts/check_espinha.py --selftest

      - name: "GATE 22 — a espinha da aula: etapas, telas dentro delas, minutos que fecham"
        # A unidade que quem conduz enxerga é a ETAPA, não a tela: 7 ou 8, cada uma agrupando
        # 1 a 6 telas, com o orçamento de minutos no rótulo. Essa camada sumiu inteira no
        # porte (data-stage=0, stage-seg=0, stage-label=0) e ninguém viu — as 15-18 telas
        # passaram a ler como fila linear de passos, e foi isso que o Dan abriu e estranhou.
        # anatomias.json listou as quatro checagens como "levantado, NÃO construído"; aqui
        # elas existem.
        run: python3 scripts/check_espinha.py

      - name: "GATE 21 — selftest: prova que o gate de paridade ainda morde"
        run: python3 scripts/check_artefato_paridade.py --selftest

      - name: "GATE 21 — a interface gerada é a do ARTEFATO"
        # O artefato (_build/model/artefatos/erica-professor-view.html) é a ESPECIFICAÇÃO da
        # interface — decisão do Dan, 11/08/2026: "SE AS AULAS NÃO ESTÃO IDÊNTICAS AO
        # ARTEFATO, NO QUESITO INTERFACE, ENTÃO ESTÁ ERRADO".
        # O porte de 07/08 renomeou e reimplementou cada peça (reveal-item -> ic-reveal,
        # blank-input -> ic-blank...) e deixou quatro de fora — callout, a MAIS usada do
        # artefato, tbl-wrap, quiz-option e rule-box. Ninguém viu porque o inventário
        # catalogou os nomes NOVOS e o GATE 20 passou a comparar a cópia consigo mesma.
        # Este gate compara com o ORIGINAL. Trabalha como o GATE 8: a dívida de hoje está
        # congelada em scripts/artefato-paridade-baseline.json e só pode CAIR.
        run: python3 scripts/check_artefato_paridade.py

      - name: "GATE 20 — selftest: prova que o gate de anatomia ainda morde"
        run: python3 scripts/check_anatomia.py --selftest

      - name: "GATE 20 — a anatomia tem o que declara ter"
        # A anatomia guided-discovery foi construída lendo um ARTEFATO escrito fora do
        # sistema. Enquanto o porte acontecia, ele era a especificação — e eu perdi peça
        # duas vezes por perguntar a coisa errada ("a classe existe no shell?" responde sim
        # para tudo, porque o shell é clone; "preciso de componente novo?" conta o que EU
        # usei, não o que a anatomia tem). Resultado: duas aulas dadas como prontas com um
        # quadro de feedback que não recebia texto.
        # Terminado o porte, o SHELL é a anatomia e o inventário vive no repo. Este gate
        # confere um contra o outro — nunca contra o artefato, que não existe no CI.
        run: python3 scripts/check_anatomia.py

      - name: "GATE 19 — selftest: prova que o gate de áudio declarado ainda morde"
        run: python3 scripts/check_audio_declarado.py --selftest

      - name: "GATE 19 — anatomia que pede áudio tem áudio"
        # A aula 1 da stephanie nasceu com audioMap VAZIO e passou em TUDO: os gates de
        # áudio perguntavam "o MP3 prometido existe?", e audioMap vazio não promete nada.
        # Zero promessas, zero quebradas, verde. A pergunta que faltava é a anterior:
        # "foi prometido ALGUM?". A exigência vem do artefato que define a anatomia — 59
        # botões Listen medidos nele. A necessidade vem do artefato; o motor (ElevenLabs,
        # REGRA 7) vem do repo, e quem cobra o motor é o GATE 5.
        run: python3 scripts/check_audio_declarado.py

      - name: "GATE 18 — selftest: prova que o gate de deriva de shell ainda morde"
        run: python3 scripts/check_shell_drift.py --selftest

      - name: "GATE 18 — os shells não derivam no que tem de ser igual"
        # O molde stephanie-vicente precisa de outra ANATOMIA DE ABAS, e mexer nisso no
        # shell compartilhado durante a construção significa editar o arquivo do qual
        # descende tudo o que já está no ar. Decisão do Dan (07/08/2026): clonar,
        # temporariamente. "Temporário" é a palavra que mais mente em software — fork
        # temporário vira permanente no dia em que um conserto entra num shell e não no
        # outro, e ninguém percebe porque os DOIS continuam funcionando.
        # Este gate cobra o que TEM de ser igual (funções JS e classes-mecanismo) e exige
        # que toda diferença legítima esteja DECLARADA com motivo. O dia da unificação é
        # visível: é quando a lista de diferenças declaradas chegar a zero.
        run: python3 scripts/check_shell_drift.py

      - name: "GATE 17 — selftest: prova que o meta-gate ainda morde"
        run: python3 scripts/check_gates_registry.py --selftest

      - name: "GATE 17 — todo gate declara tipo, escopo e número único"
        # O meta-gate. Existe porque o levantamento de 06/08/2026 achou DOIS gates se
        # declarando "GATE 12" no mesmo arquivo de CI — ninguém percebeu porque nada
        # conferia. E porque, com um molde novo entrando, gate de ANATOMIA rodando no repo
        # inteiro passa a reprovar material que nunca teve aquela forma; a saída óbvia
        # (afrouxar o gate) contaminaria os 1.221 arquivos que dependem dele.
        # A regra: anatomia e sequência SEMPRE escopados; integridade, autorização,
        # regressão e processo valem para todos os moldes. Botão morto é botão morto em
        # qualquer molde; "7 capítulos na ordem X" só vale para quem tem esses capítulos.
        run: python3 scripts/check_gates_registry.py

      - name: "GATE 16 — selftest: prova que o gate de contrato ainda morde"
        run: python3 scripts/check_contrato_aula.py --selftest

      - name: "GATE 16 — a aula entrega o contrato do framework dela"
        # "Gere 3 aulas do tipo X" só vale se algo CONFERIR que saiu o tipo X. Os outros
        # gates são universais; este é o único que sabe o que CADA método promete.
        # LEGADO-TOLERANTE por construção, em dois níveis: aula sem <meta alumni-contrato>
        # é ignorada (todo o passado, REGRA 30), e aula carimbada é julgada pela VERSÃO do
        # contrato em que nasceu — editar o contrato hoje no catálogo não reprova nada de
        # ontem. Repo inteiro, como o 8/10/11: a violação pode nascer de uma edição no
        # JSON, não num arquivo que o PR tocou.
        run: python3 scripts/check_contrato_aula.py

      - name: "CATÁLOGO — o índice de aulas modelo bate com as aulas que existem"
        # /catalogo.html desenha public/data/modelos-aulas.json (título, nº de slides,
        # capítulos, framework e componentes de CADA aula modelo). Se o JSON não for
        # regerado, a página passa a MENTIR — e mentira de catálogo é pior que catálogo
        # nenhum, porque ninguém desconfia. O gate só olha as 8 personas modelo do ROSTER
        # (helen, mocks, bento, théo): aula de aluno real não entra e nunca dispara isto.
        # Conserto = uma linha: python3 scripts/gen_catalogo_modelos.py
        run: python3 scripts/gen_catalogo_modelos.py --check

      - name: "GATE 9 — gramática não repete entre aulas (REGRA 22, data-grammar)"
        # O irmão gramatical do check_vocab_progression: um data-grammar (posto pelo builder
        # no slide de Grammar Discovery) ensinado como NOVO em 2+ aulas do MESMO aluno = FAIL.
        # LEGADO-TOLERANTE por construção: aula sem data-grammar é ignorada, então nunca
        # dispara em aula antiga (que não tem o marcador) nem exige retrofit. Roda por SLUG
        # tocado, comparando a aula nova contra as irmãs já publicadas do mesmo aluno.
        if: steps.files.outputs.added != '' || steps.files.outputs.modified != ''
        run: |
          set -euo pipefail
          slugs=$(for f in ${{ steps.files.outputs.added }} ${{ steps.files.outputs.modified }}; do
            b=$(basename "$f" .html); echo "$b" | sed -E 's/-aula[0-9]+$//'
          done | sort -u)
          rc=0
          for s in $slugs; do
            files=$(ls public/professor/${s}-aula*.html 2>/dev/null || true)
            if [ -n "$files" ]; then
              echo "— aluno: $s"
              python3 _build/model/check_grammar_progression.py $files || rc=1
            fi
          done
          exit $rc

      - name: "Validador em modo AVISO (arquivos modificados — não bloqueia legado)"
        if: steps.files.outputs.modified != ''
        continue-on-error: true
        run: python3 _build/model/validate_lesson.py ${{ steps.files.outputs.modified }}
